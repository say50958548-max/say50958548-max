<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Task Manager</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif; background: #f6f8fa;
      color: #24292f;
    }
    .container { max-width: 760px; margin: 50px auto; padding: 24px; }
    .card {
      background: white; border: 1px solid #d0d7de; border-radius: 14px;
      padding: 28px; box-shadow: 0 4px 14px rgba(0,0,0,.05);
    }
    h1 { margin: 0 0 8px; }
    .subtitle { color: #57606a; margin-bottom: 24px; }
    .form { display: flex; gap: 10px; }
    input {
      flex: 1; padding: 13px; border: 1px solid #d0d7de;
      border-radius: 8px; font-size: 15px;
    }
    button {
      border: 0; border-radius: 8px; padding: 12px 18px;
      cursor: pointer; font-weight: 600;
    }
    .add { background: #24292f; color: white; }
    ul { list-style: none; padding: 0; margin: 24px 0 0; }
    li {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 4px; border-bottom: 1px solid #eaeef2;
    }
    li.done span { text-decoration: line-through; color: #8c959f; }
    li span { flex: 1; }
    .delete { background: #fff; color: #cf222e; padding: 7px 10px; }
    .stats { margin-top: 20px; color: #57606a; font-size: 14px; }
    @media (max-width: 600px) {
      .container { margin: 20px auto; padding: 12px; }
      .card { padding: 20px; }
      .form { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Simple Task Manager</h1>
      <p class="subtitle">A lightweight task manager built with vanilla HTML, CSS and JavaScript.</p>

      <div class="form">
        <input id="taskInput" type="text" placeholder="할 일을 입력하세요">
        <button class="add" onclick="addTask()">Add Task</button>
      </div>

      <ul id="taskList"></ul>
      <div class="stats" id="stats"></div>
    </section>
  </main>

  <script>
    let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");

    function save() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function render() {
      const list = document.getElementById("taskList");
      list.innerHTML = "";

      tasks.forEach((task, index) => {
        const li = document.createElement("li");
        if (task.done) li.className = "done";

        li.innerHTML = `
          <input type="checkbox" ${task.done ? "checked" : ""} onchange="toggleTask(${index})">
          <span>${escapeHtml(task.text)}</span>
          <button class="delete" onclick="deleteTask(${index})">삭제</button>
        `;
        list.appendChild(li);
      });

      const completed = tasks.filter(t => t.done).length;
      document.getElementById("stats").textContent =
        `전체 ${tasks.length}개 · 완료 ${completed}개`;
    }

    function addTask() {
      const input = document.getElementById("taskInput");
      const text = input.value.trim();
      if (!text) return;

      tasks.push({ text, done: false });
      input.value = "";
      save();
      render();
    }

    function toggleTask(index) {
      tasks[index].done = !tasks[index].done;
      save();
      render();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      save();
      render();
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById("taskInput").addEventListener("keydown", e => {
      if (e.key === "Enter") addTask();
    });

    render();
  </script>
</body>
</html>
